name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand --no-watchman

      - name: Bundle iOS and Android
        run: npx expo export --platform ios --platform android --output-dir /tmp/malang-dist

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Diff whitespace check
        run: git diff --check origin/main...HEAD

      - name: Repository clean check
        run: test -z "$(git status --porcelain)"
